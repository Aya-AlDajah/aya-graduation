  <body>
    <style>
      /* Instant paint before any JS/CSS arrives; React replaces this on mount.
         Background lives on #root:empty only, so theme vars own the body. */
      body {
        margin: 0;
      }
      #root:empty::before {
        content: 'دعوة تخرّج';
        letter-spacing: 0.08em;
        color: #a8813d;
        font-size: 0.85rem;
      }
      #root:empty::after {
        content: 'آية محمد الدعجة';
        color: #46392f;
        font-size: clamp(1.8rem, 8vw, 3rem);
        font-weight: 700;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        font-family: system-ui, sans-serif;
        background:
          radial-gradient(60% 45% at 15% 8%, rgba(224, 188, 180, 0.35), transparent 70%),
          radial-gradient(55% 40% at 88% 30%, rgba(223, 199, 154, 0.28), transparent 70%),
          #fdfbf7;
      }
      @keyframes splash-pulse {
        50% { opacity: 0.55; }
      }
    </style>
    <div id="root"></div>

    <!-- Guestbook CTA (static; React never touches nodes outside #root) -->
    <a id="guestbook-cta" href="https://aya-guestbook.pages.dev/"
       aria-label="افتحوا دفتر ذكريات آية">

    <style>
      #guestbook-cta {

        bottom: max(1.1rem, env(safe-area-inset-bottom));
        inset-inline-start: max(1.1rem, env(safe-area-inset-right));
        z-index: 60;
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.72rem 1.5rem;
        border-radius: 999px;
        background: var(--color-rose-deep, #a5626b);
        color: var(--color-cream, #fdfbf7);
        font-family: 'El Messiri', 'Amiri', system-ui, sans-serif;
        font-size: 1.02rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-decoration: none;
        box-shadow: 0 18px 40px -18px rgba(165, 98, 107, 0.6);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      #guestbook-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 44px -18px rgba(165, 98, 107, 0.7);
      }
      #guestbook-cta .gb-icon { font-size: 1.15rem; }
      #root:empty ~ #guestbook-cta { display: none; }
    </style>
